# Keeps a free Render instance awake, so scheduled campaigns go out on time.
#
# Render's free tier stops the server after 15 minutes without a request, and
# the call dispatcher runs inside that server - so while it sleeps, nothing
# scheduled is dialled. Pinging /healthz every 10 minutes keeps it up.
#
# Off until you add a repository variable named KEEPALIVE_URL (Settings >
# Secrets and variables > Actions > Variables) set to the site's address, e.g.
# https://your-app.onrender.com. It is a variable rather than written here
# because this repository is public and the dashboard has no sign-in yet.
#
# GitHub runs scheduled workflows late when it is busy, so this narrows the
# gaps rather than closing them. A paid Render instance never sleeps.
name: Keep the server awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    if: ${{ vars.KEEPALIVE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        env:
          URL: ${{ vars.KEEPALIVE_URL }}
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 90 "${URL%/}/healthz"
